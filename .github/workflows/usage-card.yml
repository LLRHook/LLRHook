name: usage card
on:
  schedule:
    - cron: "15 9 * * *"
  push:
    paths:
      - data/usage.json
      - scripts/usage_card.py
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: usage-card
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python scripts/usage_card.py render
      - name: Commit rendered cards
        run: |
          if [ -n "$(git status --porcelain assets)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898475+github-actions[bot]@users.noreply.github.com"
            git add assets
            git commit -m "Render usage card"
            git push
          fi
